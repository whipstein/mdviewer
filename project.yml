name: MDViewer
options:
  bundleIdPrefix: com.mdviewer
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.5.0"

targets:
  MDViewerQL:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MDViewer/MDViewerQL
        createIntermediateGroups: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdviewer.app.qlextension
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        DEVELOPMENT_TEAM: EESHX57W67
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_ENTITLEMENTS: MDViewer/MDViewerQL/MDViewerQL.entitlements
        INFOPLIST_FILE: MDViewer/MDViewerQL/Info.plist

  MDViewer:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MDViewer
        excludes:
          - Resources
          - MDViewerQL
        createIntermediateGroups: true
      # The asset catalog (app icon) must be compiled by the build, so include it
      # explicitly as a source. The Resources folder as a whole is excluded above.
      - path: MDViewer/Resources/Assets.xcassets
    dependencies:
      - package: swift-markdown
        product: Markdown
      - target: MDViewerQL
        embed: true
    postCompileScripts:
      - name: "Copy Web Resources"
        script: |
          set -e
          DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources"
          mkdir -p "${DEST}"
          cp -R "${SRCROOT}/MDViewer/Resources/Web" "${DEST}/"
          cp -R "${SRCROOT}/MDViewer/en.lproj" "${DEST}/"
        inputFiles:
          - $(SRCROOT)/MDViewer/Resources/Web
          - $(SRCROOT)/MDViewer/en.lproj
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Resources/Web
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Resources/en.lproj
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdviewer.app
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        DEVELOPMENT_TEAM: EESHX57W67
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_ENTITLEMENTS: MDViewer/MDViewer.entitlements
        INFOPLIST_FILE: MDViewer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: MDViewer/MDViewer.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true

schemes:
  MDViewer:
    build:
      targets:
        MDViewer: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  MDViewerQL:
    build:
      targets:
        MDViewerQL: all
